<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>BreadMaker3000</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1c1a;--mute:#6b6860;--accent:#b8691c;--line:#e4e1da}
@media (prefers-color-scheme:dark){:root{--bg:#141311;--card:#1f1d1a;--ink:#f0ede6;--mute:#a09b90;--accent:#e08a3a;--line:#34312c}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--mute);margin:0 0 20px;font-size:14px}
input,button{width:100%;box-sizing:border-box;font-size:17px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{margin-top:12px;background:var(--accent);color:#fff;border:0;font-weight:600}
.err{color:#c0392b;font-size:14px;margin-top:10px;display:none}
</style></head><body>
<form method="post" action="/setup">
<h1>🍞 Welcome</h1><p>First-time setup: choose your dashboard password (12+ characters). Save it in your iPhone Passwords app.</p>
<input type="password" name="password" placeholder="New password" autocomplete="new-password" minlength="12" required autofocus>
<input type="password" name="password2" placeholder="Repeat password" autocomplete="new-password" minlength="12" required style="margin-top:10px">
<button type="submit">Save and continue</button>
<div class="err" id="err">Passwords must match and be at least 12 characters.</div>
</form>
<script>if(location.search.includes('error'))document.getElementById('err').style.display='block'</script>
</body></html>
