#cloud-config
# BreadMaker3000 - paste this whole file into your cloud provider's "cloud-init" / "user data" box
# (Oracle: Create instance > Show advanced options > Management > "Paste cloud-init script").
# Fill in the TWO lines marked EDIT below first. Everything else is automatic.
# The server installs itself (~15-20 minutes) and appears in your Tailscale app as "breadmaker".
#
# Credential handling (see SECURITY.md): no shell tracing; secrets are moved into 0600 files on
# a RAM-backed directory, never passed on a command line, never printed, and shredded on exit
# (also on failure). The variables in this file are blanked after the first run.
write_files:
  - path: /root/breadmaker-bootstrap.sh
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      # NEVER add "set -x" here: tracing would copy credentials into logs.
      set -euo pipefail
      set +x
      # ---------------------------------------------------------------- EDIT ↓
      TS_AUTHKEY="PASTE-TAILSCALE-AUTH-KEY-HERE"   # one-off key from login.tailscale.com > Settings > Keys
      GH_TOKEN=""                                  # only if the GitHub repo is PRIVATE: read-only token
      # ---------------------------------------------------------------- EDIT ↑
      REPO="github.com/devincombs2007-rgb/BreadMaker3000.git"
      BRANCH="${BM_BRANCH:-main}"
      DEST="${BM_DEST:-/opt/breadmaker}"
      LOG="${BM_LOG:-/var/log/breadmaker-bootstrap.log}"
      SELF="${BM_SELF:-/root/breadmaker-bootstrap.sh}"
      SECRETS_DIR="$(mktemp -d "${BM_SECRETS_PARENT:-/run}/bm-secrets.XXXXXX")"
      umask 077

      # Move secrets out of shell variables into private files, then forget the variables.
      printf '%s' "$TS_AUTHKEY" > "$SECRETS_DIR/ts_authkey"
      GH_AUTH_HEADER=""
      if [ -n "$GH_TOKEN" ]; then
        printf 'Authorization: Basic %s' "$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" > "$SECRETS_DIR/gh_header"
      fi
      unset TS_AUTHKEY GH_TOKEN

      cleanup() {
        shred -u "$SECRETS_DIR"/* 2>/dev/null || rm -f "$SECRETS_DIR"/*
        rmdir "$SECRETS_DIR" 2>/dev/null || true
        # Blank the credentials stored in this script on disk (runs on success AND failure).
        sed -i -E 's/^([[:space:]]*TS_AUTHKEY=).*/\1"removed-after-first-run"/; s/^([[:space:]]*GH_TOKEN=).*/\1""/' "$SELF" 2>/dev/null || true
      }
      trap cleanup EXIT

      exec >>"$LOG" 2>&1
      echo "bootstrap start $(date -u +%FT%TZ)"
      apt-get update -y
      DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates

      if [ ! -d "$DEST/.git" ]; then
        if [ -s "$SECRETS_DIR/gh_header" ]; then
          # Header is supplied through git's environment-config mechanism: not in argv, not in .git/config.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="$(cat "$SECRETS_DIR/gh_header")" \
            GIT_TERMINAL_PROMPT=0 git clone --quiet --branch "$BRANCH" "https://${REPO}" "$DEST"
        else
          GIT_TERMINAL_PROMPT=0 git clone --quiet --branch "$BRANCH" "https://${REPO}" "$DEST"
        fi
      fi
      id ubuntu >/dev/null 2>&1 && chown -R ubuntu:ubuntu "$DEST" || true
      cd "$DEST"
      bash deploy/install.sh
      TS_AUTHKEY_FILE="$SECRETS_DIR/ts_authkey" bash deploy/tailscale.sh
      echo "BREADMAKER BOOTSTRAP COMPLETE"
runcmd:
  - [bash, /root/breadmaker-bootstrap.sh]
